name: release

# Tagging v0.2.0 publishes a release whose APK the app's own updater will find
# and offer to install. That is the slow half of self-modification closing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - name: Restore signing keystore
        # Unsigned release APKs cannot be installed. When no keystore secret is
        # configured the build still runs and produces a debug-signed APK, so a
        # fresh clone is not blocked on secrets it does not have.
        #
        # The check is in the shell rather than in `if:`, because the secrets
        # context is not available to step-level conditions and using it there
        # fails the whole workflow before any job starts.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing keystore configured; the APK will be debug-signed."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # An unsigned release APK cannot be installed on any device. Failing here
      # is better than publishing a file that looks right and is refused by the
      # package installer with no explanation.
      - name: Refuse to publish an unsigned APK
        run: |
          if ls app/build/outputs/apk/release/*unsigned*.apk >/dev/null 2>&1; then
            echo "The release APK is unsigned: no signing keystore is configured."
            echo "Add the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and"
            echo "KEY_PASSWORD secrets, or install the rolling debug build from"
            echo "the latest-debug release instead."
            exit 1
          fi

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/myllm-${GITHUB_REF_NAME}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
