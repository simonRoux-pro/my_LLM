name: build

# Every branch, not just main: this repository's whole point is that the phone
# installs what CI produces, so a branch that does not build is a branch whose
# APK cannot be tried.
on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Needed to publish the rolling debug release below. Nothing else in this
    # workflow writes to the repository.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # llama.cpp is a pinned submodule; without it the native build has no
          # sources and the whole engine module fails to configure.
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Tests and debug APK
        run: |
          # pipefail so tee does not swallow Gradle's exit code.
          set -o pipefail
          ./gradlew test assembleDebug --no-daemon --console=plain --stacktrace \
            2>&1 | tee gradle-output.log

      # A green build does not prove the native engine shipped: if CMake had
      # silently produced nothing, the APK would still assemble and the app
      # would fall back to remote-only on the phone, which is the failure that
      # would be hardest to notice.
      - name: Verify APK contents
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          echo "--- native libraries ---"
          unzip -l "$APK" | grep -E 'lib/.*\.so' || {
            echo "No native library in the APK. The llama.cpp engine is missing."
            exit 1
          }
          # Written into the release notes rather than only the log: a size
          # regression is something to notice while installing, not something
          # to go digging for in a build that already finished.
          BREAKDOWN=$(unzip -l "$APK" | awk '
            /\.so$/  { so  += $1 }
            /\.dex$/ { dex += $1 }
            /resources\.arsc$/ { arsc += $1 }
            /res\//  { res += $1 }
            /assets\// { ass += $1 }
            { total += $1 }
            END {
              printf "natif %.0f Mo, code %.0f Mo, ressources %.0f Mo, assets %.0f Mo, total décompressé %.0f Mo",
                so/1048576, dex/1048576, (res+arsc)/1048576, ass/1048576, total/1048576
            }')
          echo "--- where the megabytes are ---"
          echo "$BREAKDOWN"
          echo "APK_BREAKDOWN=$BREAKDOWN" >> "$GITHUB_ENV"
          mkdir -p dist
          cp "$APK" dist/myllm-debug.apk
          echo "APK_SIZE=$(du -h dist/myllm-debug.apk | cut -f1)" >> "$GITHUB_ENV"
          echo "NATIVE_SIZE=$(unzip -l "$APK" | grep 'libmyllm_llama.so' | awk '{print int($1/1048576)" Mo"}')" >> "$GITHUB_ENV"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: myllm-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # A fixed tag means one permanent link that always points at the newest
      # build: https://github.com/simonRoux-pro/my_LLM/releases/download/latest-debug/myllm-debug.apk
      # An artifact would need a GitHub login and arrive as a zip, which is
      # unusable from the phone this app is for.
      #
      # Marked prerelease so the in-app updater ignores it: these are debug
      # builds off main, not versions anyone chose to ship.
      - name: Publish rolling debug build
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Dernier build de développement
          body: |
            APK de développement, reconstruit à chaque push sur `main`.

            Commit : ${{ github.sha }}
            Taille du fichier : ${{ env.APK_SIZE }}
            Contenu : ${{ env.APK_BREAKDOWN }}

            Lien direct, toujours à jour :
            https://github.com/simonRoux-pro/my_LLM/releases/download/latest-debug/myllm-debug.apk

            Signé avec la clé de debug d'Android. Pour l'installer il faut
            autoriser les sources inconnues pour le navigateur.
          prerelease: true
          files: dist/myllm-debug.apk

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: gradle-output.log
          retention-days: 7

      # Deliberately the last step so it lands at the end of the job log.
      # Gradle prints compiler diagnostics in the middle of a long run and the
      # tail of the log is otherwise nothing but a Gradle stack trace, which
      # says what failed but never why.
      - name: Compiler diagnostics
        if: failure()
        run: |
          echo "=============== KOTLIN / JAVA ERRORS ==============="
          grep -E "^(e: |w: .*error|ERROR:)" gradle-output.log | head -150 \
            || echo "(none found)"
          echo
          echo "=============== NATIVE (CMAKE / NDK) ==============="
          grep -iE "(error:|fatal error|undefined reference|CMake Error)" gradle-output.log \
            | grep -v "^e: " | head -60 || echo "(none found)"
          echo
          echo "=============== FAILING GRADLE TASKS ==============="
          grep -E "^(> Task .*(FAILED|failed)|FAILURE:|\* What went wrong:)" gradle-output.log \
            | head -30 || echo "(none found)"
          echo
          echo "=============== TEST FAILURES ==============="
          grep -E "(tests? completed.*(failed|error)|FAILED$)" gradle-output.log \
            | head -30 || echo "(none found)"
